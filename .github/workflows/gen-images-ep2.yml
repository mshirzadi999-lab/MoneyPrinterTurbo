name: Gen Images Ep2

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated image keys (blank = all)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate episode 2 backgrounds (Klein 4B)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CLOUDFLARE_API_TOKEN_3 }}
          ONLY: ${{ inputs.only }}
        run: python tools/gen_images_ep2.py
      - name: Upload backgrounds
        uses: actions/upload-artifact@v4
        with:
          name: ep2-bgs
          path: ep2_bgs/
