name: MPT Build Video

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Video subject label"
        required: true
        type: string
      script:
        description: "Full narration script"
        required: true
        type: string
      terms:
        description: "Stock search terms (English, comma separated)"
        required: false
        default: "shop"
        type: string
      materials:
        description: "Direct footage URLs (comma separated). If set, API sources are skipped."
        required: false
        default: ""
        type: string
      voice:
        description: "TTS voice name"
        required: false
        default: "fa-IR-FaridNeural"
        type: string
      aspect:
        description: "Video aspect"
        required: false
        default: "9:16"
        type: choice
        options:
          - "9:16"
          - "16:9"
          - "1:1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write config.toml from secrets
        env:
          PEXELS_API_KEYS: ${{ secrets.PEXELS_API_KEYS }}
          PIXABAY_API_KEYS: ${{ secrets.PIXABAY_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp config.example.toml config.toml
          python3 - <<'PY'
          import os, json
          pex = [k.strip() for k in os.environ.get("PEXELS_API_KEYS", "").split(",") if k.strip()]
          pix = [k.strip() for k in os.environ.get("PIXABAY_API_KEYS", "").split(",") if k.strip()]
          gem = os.environ.get("GEMINI_API_KEY", "").strip()
          source = "pexels" if pex else ("pixabay" if pix else "pexels")
          lines = open("config.toml", encoding="utf-8").read().splitlines()
          out = []
          for ln in lines:
              if ln.startswith("pexels_api_keys"):
                  ln = "pexels_api_keys = " + json.dumps(pex)
              elif ln.startswith("pixabay_api_keys"):
                  ln = "pixabay_api_keys = " + json.dumps(pix)
              elif ln.startswith("gemini_api_key"):
                  ln = 'gemini_api_key = "' + gem + '"'
              elif ln.startswith("llm_provider"):
                  ln = 'llm_provider = "gemini"'
              elif ln.startswith("video_source"):
                  ln = 'video_source = "' + source + '"'
              out.append(ln)
          open("config.toml", "w", encoding="utf-8").write("\n".join(out) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("VIDEO_SOURCE=" + source + "\n")
          print("pexels keys:", len(pex), "| pixabay keys:", len(pix), "| source:", source, "| gemini key set:", bool(gem))
          PY

      - name: Download provided materials
        if: ${{ inputs.materials != '' }}
        env:
          MATERIALS: ${{ inputs.materials }}
        run: |
          mkdir -p materials
          i=0
          LIST=""
          IFS=',' read -ra URLS <<< "$MATERIALS"
          for u in "${URLS[@]}"; do
            i=$((i+1))
            f=$(printf "materials/clip%02d.mp4" "$i")
            echo "Downloading $u -> $f"
            curl -fL --retry 3 -o "$f" "$u"
            LIST="${LIST:+$LIST,}$f"
          done
          echo "MATERIALS_LIST=$LIST" >> "$GITHUB_ENV"
          ls -la materials

      - name: Build video (local materials)
        if: ${{ inputs.materials != '' }}
        env:
          SUBJECT: ${{ inputs.subject }}
          SCRIPT: ${{ inputs.script }}
          VOICE: ${{ inputs.voice }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          python cli.py --video-subject "$SUBJECT" --video-script "$SCRIPT" --video-source local --video-materials "$MATERIALS_LIST" --voice-name "$VOICE" --video-aspect "$ASPECT" --video-count 1 --subtitle-enabled

      - name: Build video (API source)
        if: ${{ inputs.materials == '' }}
        env:
          SUBJECT: ${{ inputs.subject }}
          SCRIPT: ${{ inputs.script }}
          TERMS: ${{ inputs.terms }}
          VOICE: ${{ inputs.voice }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          python cli.py --video-subject "$SUBJECT" --video-script "$SCRIPT" --video-terms "$TERMS" --video-source "$VIDEO_SOURCE" --voice-name "$VOICE" --video-aspect "$ASPECT" --video-count 1 --subtitle-enabled

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-video
          path: |
            storage/tasks/**/*.mp4
          if-no-files-found: warn
