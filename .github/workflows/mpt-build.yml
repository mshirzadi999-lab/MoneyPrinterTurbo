name: MPT Build Video

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Video subject label"
        required: true
        type: string
      script:
        description: "Full narration script"
        required: true
        type: string
      terms:
        description: "Stock search terms (English, comma separated)"
        required: false
        default: "shop"
        type: string
      materials:
        description: "Direct footage URLs (comma separated). If set, API sources are skipped."
        required: false
        default: ""
        type: string
      voice:
        description: "TTS voice name"
        required: false
        default: "fa-IR-FaridNeural"
        type: string
      aspect:
        description: "Video aspect"
        required: false
        default: "9:16"
        type: choice
        options:
          - "9:16"
          - "16:9"
          - "1:1"
      voice_rate:
        description: "Voice speed (1.0 = normal)"
        required: false
        default: "1.15"
        type: string
      clip_duration:
        description: "Seconds per video chunk"
        required: false
        default: "3"
        type: string
      subtitles:
        description: "Burn subtitles into the video"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      match_script:
        description: "Match stock clips to script order (API sources)"
        required: false
        default: "on"
        type: choice
        options:
          - "on"
          - "off"
      source_mode:
        description: "auto = stock APIs (Coverr etc.), cloudflare = generated images"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "cloudflare"
      image_style:
        description: "Prompt template for generated images ({term} placeholder)"
        required: false
        default: "minimal flat vector illustration of {term}, centered composition, soft beige background, muted teal and orange accents, simple clean shapes, no text, no letters, no words, no watermark"
        type: string
      builder:
        description: "mpt = MoneyPrinterTurbo pipeline, segmented = per-sentence build (Gemini voice + generated images, exact sync)"
        required: false
        default: "mpt"
        type: choice
        options:
          - "mpt"
          - "segmented"
      segments:
        description: "Segmented mode only: one line per sentence: <sentence> ||| <image prompt>"
        required: false
        default: ""
        type: string
      style_prompt:
        description: "Segmented mode: style instruction prepended to each TTS call"
        required: false
        default: "Read the following Persian text aloud in a commanding narration style, with rich vocal modulation and dramatic pauses. Read only the Persian text, not this instruction:"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write config.toml from secrets
        env:
          PEXELS_API_KEYS: ${{ secrets.PEXELS_API_KEYS }}
          PIXABAY_API_KEYS: ${{ secrets.PIXABAY_API_KEYS }}
          COVERR_API_KEYS: ${{ secrets.COVERR_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_MODE: ${{ inputs.source_mode }}
          IMAGE_STYLE: ${{ inputs.image_style }}
        run: |
          cp config.example.toml config.toml
          python3 - <<'PY'
          import os, json
          pex = [k.strip() for k in os.environ.get("PEXELS_API_KEYS", "").split(",") if k.strip()]
          pix = [k.strip() for k in os.environ.get("PIXABAY_API_KEYS", "").split(",") if k.strip()]
          cov = [k.strip() for k in os.environ.get("COVERR_API_KEYS", "").split(",") if k.strip()]
          gem = os.environ.get("GEMINI_API_KEY", "").strip()
          mode = os.environ.get("SOURCE_MODE", "auto").strip()
          style = os.environ.get("IMAGE_STYLE", "").strip()
          source = "pexels" if pex else ("pixabay" if pix else ("coverr" if cov else "pexels"))
          if mode == "cloudflare":
              source = "openai_image"
          lines = open("config.toml", encoding="utf-8").read().splitlines()
          out = []
          for ln in lines:
              if ln.startswith("pexels_api_keys"):
                  ln = "pexels_api_keys = " + json.dumps(pex)
              elif ln.startswith("pixabay_api_keys"):
                  ln = "pixabay_api_keys = " + json.dumps(pix)
              elif ln.startswith("coverr_api_keys"):
                  ln = "coverr_api_keys = " + json.dumps(cov)
              elif ln.startswith("gemini_api_key"):
                  ln = 'gemini_api_key = "' + gem + '"'
              elif ln.startswith("llm_provider"):
                  ln = 'llm_provider = "gemini"'
              elif ln.startswith("video_source"):
                  ln = 'video_source = "' + source + '"'
              elif mode == "cloudflare" and ln.startswith("openai_image_base_url"):
                  ln = 'openai_image_base_url = "http://127.0.0.1:8123/v1"'
              elif mode == "cloudflare" and ln.startswith("openai_image_api_keys"):
                  ln = 'openai_image_api_keys = ["shim-local"]'
              elif mode == "cloudflare" and ln.startswith("openai_image_model"):
                  ln = 'openai_image_model = "@cf/black-forest-labs/flux-1-schnell"'
              elif mode == "cloudflare" and ln.startswith("openai_image_prompt_template"):
                  ln = "openai_image_prompt_template = " + json.dumps(style)
              out.append(ln)
          open("config.toml", "w", encoding="utf-8").write("\n".join(out) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("VIDEO_SOURCE=" + source + "\n")
          print("pexels keys:", len(pex), "| pixabay keys:", len(pix), "| source:", source, "| gemini key set:", bool(gem))
          PY

      - name: Start Cloudflare image shim
        if: ${{ inputs.source_mode == 'cloudflare' || inputs.builder == 'segmented' }}
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          nohup python3 tools/cf_image_shim.py > shim.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/health > /dev/null; then echo "shim is up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/health
          cat shim.log
          echo "Smoke test: one image through the shim"
          SMOKE=$(curl -s -X POST http://127.0.0.1:8123/v1/images/generations -H "Content-Type: application/json" -d '{"prompt":"a red apple on a wooden table"}')
          echo "$SMOKE" | head -c 300
          echo
          if echo "$SMOKE" | grep -q '"error"'; then echo "SMOKE FAILED"; cat shim.log; exit 1; fi
          echo "SMOKE OK (response chars: ${#SMOKE})"

      - name: Download provided materials
        if: ${{ inputs.materials != '' }}
        env:
          MATERIALS: ${{ inputs.materials }}
        run: |
          mkdir -p materials
          i=0
          LIST=""
          IFS=',' read -ra URLS <<< "$MATERIALS"
          for u in "${URLS[@]}"; do
            i=$((i+1))
            f=$(printf "materials/clip%02d.mp4" "$i")
            echo "Downloading $u -> $f"
            curl -fL --retry 3 -o "$f" "$u"
            LIST="${LIST:+$LIST,}$f"
          done
          echo "MATERIALS_LIST=$LIST" >> "$GITHUB_ENV"
          ls -la materials

      - name: Build video (local materials)
        if: ${{ inputs.builder == 'mpt' && inputs.materials != '' }}
        env:
          SUBJECT: ${{ inputs.subject }}
          SCRIPT: ${{ inputs.script }}
          VOICE: ${{ inputs.voice }}
          ASPECT: ${{ inputs.aspect }}
          VOICE_RATE: ${{ inputs.voice_rate }}
          CLIP_DURATION: ${{ inputs.clip_duration }}
          SUBTITLES: ${{ inputs.subtitles }}
        run: |
          SUB_FLAG="--no-subtitle-enabled"
          if [ "$SUBTITLES" = "on" ]; then SUB_FLAG="--subtitle-enabled"; fi
          python cli.py --video-subject "$SUBJECT" --video-script "$SCRIPT" --video-source local --video-materials "$MATERIALS_LIST" --voice-name "$VOICE" --video-aspect "$ASPECT" --video-count 1 --voice-rate "$VOICE_RATE" --video-clip-duration "$CLIP_DURATION" $SUB_FLAG

      - name: Build video (API source)
        if: ${{ inputs.builder == 'mpt' && inputs.materials == '' }}
        env:
          SUBJECT: ${{ inputs.subject }}
          SCRIPT: ${{ inputs.script }}
          TERMS: ${{ inputs.terms }}
          VOICE: ${{ inputs.voice }}
          ASPECT: ${{ inputs.aspect }}
          VOICE_RATE: ${{ inputs.voice_rate }}
          CLIP_DURATION: ${{ inputs.clip_duration }}
          SUBTITLES: ${{ inputs.subtitles }}
          MATCH_SCRIPT: ${{ inputs.match_script }}
        run: |
          SUB_FLAG="--no-subtitle-enabled"
          if [ "$SUBTITLES" = "on" ]; then SUB_FLAG="--subtitle-enabled"; fi
          MATCH_FLAG=""
          if [ "$MATCH_SCRIPT" = "on" ]; then MATCH_FLAG="--match-materials-to-script"; fi
          python cli.py --video-subject "$SUBJECT" --video-script "$SCRIPT" --video-terms "$TERMS" --video-source "$VIDEO_SOURCE" --voice-name "$VOICE" --video-aspect "$ASPECT" --video-count 1 --voice-rate "$VOICE_RATE" --video-clip-duration "$CLIP_DURATION" $SUB_FLAG $MATCH_FLAG

      - name: Build video (segmented)
        if: ${{ inputs.builder == 'segmented' }}
        env:
          SEGMENTS: ${{ inputs.segments }}
          VOICE: ${{ inputs.voice }}
          STYLE_PROMPT: ${{ inputs.style_prompt }}
          IMAGE_STYLE: ${{ inputs.image_style }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/segmented_build.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-video
          path: |
            storage/tasks/**/*.mp4
          if-no-files-found: warn
