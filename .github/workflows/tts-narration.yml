name: TTS Narration (Cruz)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gemini SDK
        run: pip install -q "google-genai==2.11.0"
      - name: Synthesize narration lines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: python tools/tts_narration.py
      - name: Upload narration lines
        uses: actions/upload-artifact@v4
        with:
          name: cruz-narration
          path: narration_out/
