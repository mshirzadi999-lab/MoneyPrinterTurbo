name: TTS Fix Lines (Cruz plain)

on:
  workflow_dispatch:
    inputs:
      indices:
        description: "Line indices to redo, e.g. 4,5,6"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gemini SDK
        run: pip install -q "google-genai==2.11.0"
      - name: Re-synthesize lines (no style prompt)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          FIX_INDICES: ${{ inputs.indices }}
        run: python tools/tts_fix.py
      - name: Upload fixed lines
        uses: actions/upload-artifact@v4
        with:
          name: cruz-narration-fix
          path: narration_fix/
