name: Model Compare

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt sent identically to both models (blank = built-in detailed bazaar prompt)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate with both models
        env:
          COMPARE_PROMPT: ${{ inputs.prompt }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CLOUDFLARE_API_TOKEN_3 }}
        run: python tools/model_compare.py
      - name: Upload comparison images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-compare
          path: compare/*.png
